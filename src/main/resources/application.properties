spring.application.name=trackflow-reports-api
server.port=${PORT:8082}
server.forward-headers-strategy=framework

spring.datasource.url=${TRACKFLOW_DB_URL:jdbc:postgresql://localhost:5432/trackflow}
spring.datasource.username=${TRACKFLOW_DB_USER:postgres}
spring.datasource.password=${TRACKFLOW_DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Solo API 1 es duena del esquema. Esta API tampoco incluye la dependencia Flyway.
spring.flyway.enabled=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=6
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
trackflow.events.exchange=${TRACKFLOW_EVENTS_EXCHANGE:trackflow.events}
trackflow.events.shipment-created-key=${TRACKFLOW_SHIPMENT_CREATED_KEY:shipment.created}
trackflow.events.logistics-registered-key=${TRACKFLOW_LOGISTICS_REGISTERED_KEY:logistics.event.registered}
trackflow.reports.events.queue=${TRACKFLOW_REPORTS_EVENTS_QUEUE:trackflow.reports.events}
trackflow.reports.events.dead-letter-exchange=${TRACKFLOW_REPORTS_DLX:trackflow.reports.dlx}
trackflow.reports.events.dead-letter-queue=${TRACKFLOW_REPORTS_DLQ:trackflow.reports.events.dlq}

trackflow.security.enabled=${TRACKFLOW_SECURITY_ENABLED:true}
trackflow.security.jwt-secret=${TRACKFLOW_JWT_SECRET:}
trackflow.security.inactividad-minutos=${TRACKFLOW_INACTIVIDAD_MINUTOS:30}
trackflow.cors.allowed-origins=${TRACKFLOW_CORS_ORIGINS:http://localhost:5173}
spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${TRACKFLOW_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${TRACKFLOW_SWAGGER_ENABLED:true}
